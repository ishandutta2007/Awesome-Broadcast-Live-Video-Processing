<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Broadcast Modern Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>

  <!-- Dynamic Animated Video Waveform & Broadcast Signal Lines -->
  <g opacity="0.3">
    <!-- Live Video Audio Waveform Line 1 -->
    <path d="M 0 250 Q 150 180, 300 230 T 600 200 T 900 260 T 1200 190" fill="none" stroke="#ef4444" stroke-width="3">
      <animate attributeName="d" 
               values="M 0 250 Q 150 180, 300 230 T 600 200 T 900 260 T 1200 190;
                       M 0 230 Q 150 260, 300 190 T 600 240 T 900 210 T 1200 240;
                       M 0 250 Q 150 180, 300 230 T 600 200 T 900 260 T 1200 190" 
               dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- Signal Stream Flow (Low Latency Stream) -->
    <path d="M 0 280 Q 200 320, 400 250 T 800 290 T 1200 230" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Background Decorative Glowing Spheres -->
  <circle cx="150" cy="80" r="120" fill="#ef4444" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="270" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitle Area -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Top LIVE Indicator Pill Tag -->
    <g transform="translate(0, -75)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="-140" cy="0" r="5" fill="#ef4444">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="10" y="5" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">📡 BROADCAST &amp; LIVE VIDEO PROCESSING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Broadcast Live Video Processing
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Real-Time Transcoding • Playout Automation • Low-Latency SRT/WebRTC • Media Asset Management
    </text>

    <!-- Accent Indicator Bar -->
    <rect x="-80" y="80" width="160" height="4" rx="2" fill="url(#primaryGlow)"/>
  </g>

  <!-- Bottom Technical Protocol Footer Accent -->
  <g transform="translate(600, 310)" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">
    <text x="-320" y="0">🎥 RTMP / SRT / LL-HLS</text>
    <text x="-100" y="0">⚙️ FFMPEG &amp; NVENC ACCELERATION</text>
    <text x="120" y="0">🎬 CASPARCG &amp; SOFIE AUTOMATION</text>
    <text x="330" y="0">☁️ AWS ELEMENTAL &amp; BITMOVIN</text>
  </g>
</svg>
